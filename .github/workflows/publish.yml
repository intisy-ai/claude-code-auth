# Generated by npm-dual-publish. Edit the template, not this file.
name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write
  packages: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Guard against runaway patch versions
        run: |
          PATCH="${GITHUB_REF_NAME##*.}"
          if [ "${PATCH:-0}" -ge 20 ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} has patch >= 20, bump the minor version (reset patch) instead of more patches."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Tokenless trusted publishing (OIDC) needs a recent npm.
      - run: npm install -g npm@latest

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - run: npm install
      - name: Build
        run: npm run build
        env:
          # The Gradle build resolves io.github.intisy:ai-java from GitHub Packages Maven
          # (intisy-ai/ai-java). GitHub Packages needs a token even for public packages;
          # ai-java's package is public, so the job's github.token (packages: read) reads it.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
      - run: git diff --exit-code -- README.md
      - run: npx vitest run

      # A shared library is compiled from its submodule, which package.json declares as a
      # file: dependency. That cannot resolve from a published tarball, so each one is
      # pinned to the version the submodule actually carries: an npm consumer then installs
      # a library at least as new as the one this artifact was compiled against. A repo with
      # no file: dependency is untouched.
      - name: Pin file dependencies to published versions
        run: |
          node <<'NODE'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const deps = pkg.dependencies || {};
          let changed = 0;
          for (const [name, spec] of Object.entries(deps)) {
            if (!String(spec).startsWith("file:")) continue;
            const { version } = JSON.parse(fs.readFileSync(String(spec).slice(5) + "/package.json", "utf8"));
            if (!version) throw new Error(name + " declares no version to pin");
            deps[name] = "^" + version;
            changed++;
            console.log(name + " -> ^" + version);
          }
          if (changed) fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          NODE

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --allow-same-version --no-git-tag-version

      - name: Publish unscoped
        run: npm publish --access public

      - name: Publish scoped
        run: |
          npm pkg set name="@intisy-ai/claude-code-auth"
          npm publish --access public

      - run: chmod +x java/gradlew
      - name: Publish provider jar
        working-directory: java
        run: ./gradlew :claude-provider:jar :claude-provider:publishGithub -Partifact_version=${{ github.ref_name }} -x test -x compileTestJava
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
