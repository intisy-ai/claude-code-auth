name: Publish to npm

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Guard against runaway patch versions
        run: |
          PATCH="${GITHUB_REF_NAME##*.}"
          if [ "${PATCH:-0}" -ge 20 ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} has patch >= 20, bump the minor version (reset patch) instead of more patches."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Tokenless trusted publishing (OIDC) needs a recent npm.
      - run: npm install -g npm@latest

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - run: npm install
      - name: Build
        run: npm run build
        env:
          # The Gradle build resolves io.github.intisy:ai-java from GitHub Packages Maven
          # (intisy-ai/ai-java), which requires read:packages even for public packages;
          # github.token cannot read another repo's packages, so use the org PAT.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.PAT }}
          GH_TOKEN: ${{ secrets.PAT }}
      - run: git diff --exit-code -- README.md
      - run: npx vitest run

      - name: Set version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --allow-same-version --no-git-tag-version

      - name: Publish unscoped
        run: npm publish --access public

      - name: Publish scoped
        run: |
          npm pkg set name="@intisy-ai/claude-code-auth"
          npm publish --access public

      - run: chmod +x java/gradlew
      - name: Publish provider jar
        working-directory: java
        run: ./gradlew :claude-provider:jar :claude-provider:publishGithub -Partifact_version=${{ github.ref_name }} -x test -x compileTestJava
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
