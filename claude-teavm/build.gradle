import org.teavm.gradle.api.JSModuleType
import org.teavm.gradle.api.OptimizationLevel

plugins {
    id "org.teavm" version "0.15.0"
}

dependencies {
    // :claude-provider carries the transpilable core this export reuses verbatim. Its own
    // first-party dependencies are all compileOnly (a thin shipped jar), which does not propagate,
    // so every classifier TeaVM must see bytecode for is declared again here as implementation.
    implementation project(":claude-provider")
    githubImplementation "intisy-ai:basekit:5.0.0:auth-contracts"
    githubImplementation "intisy-ai:basekit:5.0.0:accounts"
    githubImplementation "intisy:bayonet:1.8.0:contract"
    // ClaudeProviderJs lives in the SAME package as :js-base (io.github.intisy.ai.js) so it can
    // reference SimpleJsonCodec unqualified, exactly like CoreProxyJs/StubProviderJs do.
    githubImplementation "intisy:bayonet:1.8.0:seam"
    githubImplementation "intisy:bayonet:1.8.0:js-base"
    githubImplementation "intisy-ai:basekit:5.0.0:ir"
    githubImplementation "intisy-ai:anthropic-translator:1.3.0:anthropic"
    // SOURCE-retention, so nothing here reaches the bundle. The processor jar is a release asset and
    // carries no transitive metadata, so the annotation types it reads are named beside it.
    githubCompileOnly "intisy:bayonet:1.8.0:annotations"
    githubAnnotationProcessor "intisy:bayonet:1.8.0:processor"
    githubAnnotationProcessor "intisy:bayonet:1.8.0:annotations"
    teavm teavm.libs.jsoApis
}

// The root subprojects{} block pins Java 8 (sourceCompatibility/targetCompatibility +
// compileJava --release 8) for portability of :claude-provider. TeaVM 0.15.0's own classlib/
// jso-apis/extension-spi artifacts publish a minimum JVM-version metadata of 11-17, so
// :claude-teavm needs a newer compile target than :claude-provider -- override both the
// extension's compatibility (fixes Gradle's dependency-resolution JVM-version attribute
// matching) and the compileJava task's --release option. Mirrors stub-auth's stub-teavm/
// build.gradle exactly (which itself mirrors basekit's proxy-teavm/build.gradle).
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.named("compileJava") {
    options.release = 17
    // Emits the .d.ts for this bundle's exports, so the TypeScript seam is typed against the Java
    // rather than against a copy of it someone kept in step by hand.
    options.compilerArgs << "-Atsemit.name=claude-orchestrator.teavm"
}

// Same JVM-version attribute matching problem as compileJava, now that the root block also
// pins compileTestJava to release 8: this module's test dependencies (teavm-junit, project :teavm) require 17.
tasks.named("compileTestJava") {
    options.release = 17
}

teavm.js {
    mainClass = "io.github.intisy.ai.js.ClaudeProviderJs"
    moduleType = JSModuleType.ES2015
    obfuscated = false
    optimization = OptimizationLevel.NONE
    targetFileName = "claude-provider.js"
}
