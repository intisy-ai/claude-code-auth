dependencies {
    // Every first-party coordinate is compileOnly: the host's ProviderRegistry classloader already
    // carries these classes, so the shipped provider jar must not bundle a second copy. A
    // release-asset jar exports nothing transitively, so each classifier a source imports from is
    // named here, and named again as githubTestImplementation because compileOnly does not reach
    // the test compile classpath.
    githubCompileOnly "intisy-ai:core-auth:2.0.0:auth-contracts"
    githubCompileOnly "intisy-ai:core-auth:2.0.0:accounts"
    githubCompileOnly "intisy-ai:api:1.7.0:contract"
    githubCompileOnly "intisy-ai:api:1.7.0:seam"
    githubCompileOnly "intisy-ai:api:1.7.0:jvm-seam"
    githubCompileOnly "intisy-ai:core-ir:1.4.0:ir"
    // NOTE: no host carries anthropic-translator, so a jar-loaded ClaudeProvider hits
    // NoClassDefFoundError the moment handleIr reaches the translator. Switching to
    // `implementation` does not fix it either, because a plain jar task bundles no dependencies.
    // Shipping it needs a packaging decision (a shaded provider jar, or a published translator the
    // host resolves), which is why the scope is left honest rather than made to look solved.
    githubCompileOnly "intisy-ai:anthropic-translator:1.2.0:anthropic"

    githubTestImplementation "intisy-ai:core-auth:2.0.0:auth-contracts"
    githubTestImplementation "intisy-ai:core-auth:2.0.0:accounts"
    githubTestImplementation "intisy-ai:api:1.7.0:contract"
    githubTestImplementation "intisy-ai:api:1.7.0:seam"
    githubTestImplementation "intisy-ai:api:1.7.0:jvm-seam"
    githubTestImplementation "intisy-ai:core-ir:1.4.0:ir"
    githubTestImplementation "intisy-ai:anthropic-translator:1.2.0:anthropic"
    // GsonJsonCodec's own dependency, which a release-asset jar does not carry with it. Test-only:
    // at run time the host that loads this provider supplies gson, as it supplies the codec.
    testImplementation "com.google.code.gson:gson:2.10.1"
}

// Keep the jar filename version-less (claude-provider.jar) even though project.version is now set
// (for publishGithub's package version) -- publishGithub's artifacts block below references
// build/libs/claude-provider.jar by that exact name.
jar {
    archiveVersion = ""
}

publishGithub {
    // :claude-provider has no .git of its own, so publishGithub's default git-remote lookup fails.
    // owner/repo also drive the uploaded asset name, claude-code-auth-provider.jar.
    owner = "intisy-ai"
    repo = "claude-code-auth"
    releaseName = "Claude provider ${project.findProperty('artifact_version') ?: project.version}"
    artifacts {
        artifact {
            classifier = "provider"
            jar = file("build/libs/claude-provider.jar")
        }
    }
}
